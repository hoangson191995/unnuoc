<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Nhắc Nhở Uống Nước 🌸</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            color: #ff6b81;
            margin-bottom: 10px;
        }

        .progress-container {
            margin: 20px 0;
            background: #f1f2f6;
            border-radius: 10px;
            height: 25px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            width: 0%;
            transition: width 0.4s ease;
        }

        .stats {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #57606f;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            background-color: #70a1ff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1e90ff;
        }

        button.reset {
            background-color: #ff4757;
            grid-column: span 2;
        }

        button.reset:hover {
            background-color: #ff6b81;
        }

        .history {
            text-align: left;
            margin-top: 20px;
            font-size: 14px;
            color: #a4b0be;
            border-top: 1px solid #f1f2f6;
            padding-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Uống Nước Nào Bé 🌸</h2>
        <p>Mục tiêu: 2000 ml / ngày</p>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="stats">
            <span id="currentWater">0</span> ml / 2000 ml
        </div>

        <div class="buttons">
            <button onclick="addWater(250)">+ 250 ml (Ly)</button>
            <button onclick="addWater(500)">+ 500 ml (Chai)</button>
            <button class="reset" onclick="resetWater()">Đặt lại ngày mới</button>
        </div>

        <div class="history" id="statusMsg">
            Đang đồng bộ dữ liệu với đám mây...
        </div>
    </div>

    <script>
        // Đường dẫn API Backend trực tiếp trên Render của bạn
        const API_URL = 'https://unnuoc.onrender.com/api/water';
        const TARGET = 2000;

        // Lấy dữ liệu từ server khi vừa mở app
        async function fetchWaterData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                // Giả sử backend trả về tổng số ml nước đã uống trong ngày
                const total = data.totalWater || 0;
                updateUI(total);
                document.getElementById('statusMsg').innerText = "Đã kết nối mây thành công! ☁️";
            } catch (error) {
                console.error("Lỗi kết nối:", error);
                document.getElementById('statusMsg').innerText = "⚠️ Đang đánh thức server (mất ~50s nếu lâu không dùng)...";
                // Thử gọi lại sau vài giây nếu server đang ngủ đông
                setTimeout(fetchWaterData, 5000);
            }
        }

        // Gửi lượng nước cộng thêm lên server
        async function addWater(amount) {
            try {
                document.getElementById('statusMsg').innerText = "Đang lưu lên mây...";
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: amount })
                });
                const data = await response.json();
                updateUI(data.totalWater);
                document.getElementById('statusMsg').innerText = "Đã cập nhật thành công! ✨";
            } catch (error) {
                console.error("Lỗi gửi dữ liệu:", error);
                document.getElementById('statusMsg').innerText = "❌ Không gửi được lên server!";
            }
        }

        // Reset dữ liệu
        async function resetWater() {
            try {
                const response = await fetch(`${API_URL}/reset`, { method: 'POST' });
                const data = await response.json();
                updateUI(data.totalWater || 0);
                document.getElementById('statusMsg').innerText = "Đã làm mới ngày mới! 🌿";
            } catch (error) {
                console.error("Lỗi reset:", error);
            }
        }

        // Cập nhật giao diện thanh tiến trình
        function updateUI(current) {
            document.getElementById('currentWater').innerText = current;
            let percent = (current / TARGET) * 100;
            if (percent > 100) percent = 100;
            document.getElementById('progressBar').style.width = percent + '%';
        }

        // Chạy load dữ liệu ngay khi bật trang
        fetchWaterData();
    </script>
</body>

</html>
