<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bà chã nhớ uống nước 🌸</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #FFF0F5;
            color: #C71585;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
            padding: 20px;
            margin: 0;
            text-align: center;
        }

        .card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.15);
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #FF69B4;
        }

        .date-text {
            font-size: 15px;
            color: #DB7093;
            font-weight: bold;
            margin-bottom: 20px;
            background: #FFE4E1;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
        }

        .stats {
            font-size: 36px;
            font-weight: bold;
            color: #FF1493;
            margin: 15px 0;
        }

        .progress-wrapper {
            width: 100%;
            margin-bottom: 25px;
            position: relative;
        }

        .progress-container {
            width: 100%;
            background-color: #FFE4E1;
            border-radius: 20px;
            height: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #FFB6C1, #FF1493);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 20px;
        }

        /* Vạch chia các mốc trên progress bar */
        .progress-marker {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 105, 180, 0.45);
            border-right: 1px solid rgba(255, 255, 255, 0.9);
            z-index: 2;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .marker-1300 { left: 65%; }
        .marker-1500 { left: 75%; }
        .marker-2000 { right: 0; }

        .progress-marker.reached {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.9);
        }

        /* Nhãn số dưới các vạch */
        .progress-labels {
            position: relative;
            width: 100%;
            height: 18px;
            margin-top: 6px;
            font-size: 11px;
            color: #DB7093;
            font-weight: bold;
        }

        .marker-label {
            position: absolute;
            transform: translateX(-50%);
            white-space: nowrap;
            transition: all 0.3s ease;
            user-select: none;
        }

        .label-0 { left: 0; transform: none; }
        .label-1300 { left: 65%; }
        .label-1500 { left: 75%; }
        .label-2000 { right: 0; transform: none; }

        .marker-label.reached {
            color: #FF1493;
            font-weight: 800;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn {
            background-color: #FFB6C1;
            border: none;
            border-radius: 18px;
            padding: 15px 5px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            flex: 1;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(255, 182, 193, 0.4);
        }

        .btn:active {
            transform: scale(0.92);
            box-shadow: 0 1px 2px rgba(255, 182, 193, 0.4);
        }

        .btn:hover {
            background-color: #FF69B4;
        }

        /* Ô nhập số ml bằng tay */
        .custom-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 18px;
        }

        .custom-input {
            flex: 1;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            color: #C71585;
            background: #FFF0F5;
            border: 2px solid #FFE4E1;
            border-radius: 18px;
            outline: none;
            transition: all 0.2s;
            box-sizing: border-box;
        }

        .custom-input::placeholder {
            color: #DB7093;
            opacity: 0.8;
            font-size: 13px;
        }

        .custom-input:focus {
            border-color: #FF69B4;
            background: #FFF;
            box-shadow: 0 0 8px rgba(255, 105, 180, 0.25);
        }

        .custom-input::-webkit-outer-spin-button,
        .custom-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .custom-input[type=number] {
            -moz-appearance: textfield;
        }

        .btn-custom-add {
            background-color: #FF69B4;
            border: none;
            border-radius: 18px;
            padding: 12px 18px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(255, 105, 180, 0.3);
            white-space: nowrap;
        }

        .btn-custom-add:hover {
            background-color: #FF1493;
            transform: translateY(-1px);
        }

        .btn-custom-add:active {
            transform: scale(0.94);
        }

        /* Ô nhập ghi chú món uống ngoài nước lọc */
        .note-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .note-input {
            font-size: 13px;
            border-style: dashed;
        }

        .note-input::placeholder {
            font-size: 12px;
            color: #C71585;
            opacity: 0.7;
            font-style: italic;
        }

        .btn-note-save {
            background-color: #FFAEC9;
            border: none;
            border-radius: 18px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: bold;
            color: #8B0046;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 5px rgba(255, 174, 201, 0.4);
            white-space: nowrap;
        }

        .btn-note-save:hover {
            background-color: #FF85A2;
            color: white;
        }

        .btn-note-save:active {
            transform: scale(0.94);
        }

        /* Danh sách món uống đã ghi trong ngày */
        .today-notes-section {
            background-color: #FFF5F7;
            border: 1px dashed #FFB6C1;
            border-radius: 15px;
            padding: 10px 12px;
            margin-bottom: 16px;
            text-align: left;
            font-size: 12px;
            animation: slideUp 0.3s ease-out;
        }

        .today-notes-title {
            color: #DB7093;
            font-weight: bold;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .today-notes-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .note-badge {
            background: #FFE4E1;
            color: #C71585;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            position: relative;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }

        .note-badge:hover,
        .note-badge.show-del {
            background: #FFD1DC;
        }

        .note-del-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 0;
            height: 16px;
            opacity: 0;
            overflow: hidden;
            font-size: 15px;
            font-weight: bold;
            color: #FF1493;
            cursor: pointer;
            border: none;
            background: transparent;
            padding: 0;
            margin-left: 0;
            line-height: 1;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50%;
        }

        /* Khi rê chuột hoặc chạm vào badge thì hiện dấu x */
        .note-badge:hover .note-del-btn,
        .note-badge.show-del .note-del-btn {
            width: 16px;
            opacity: 0.9;
            margin-left: 4px;
        }

        .note-del-btn:hover {
            color: white;
            background-color: #FF1493;
            transform: scale(1.15);
            opacity: 1;
        }

        /* Ghi chú trong popup lịch sử */
        .history-notes {
            font-size: 12px;
            color: #DB7093;
            font-style: italic;
            margin-top: 3px;
        }

        .btn-history {
            background-color: transparent;
            color: #FF69B4;
            border: 2px solid #FF69B4;
            border-radius: 15px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .btn-history:hover {
            background-color: #FFF0F5;
        }

        .btn-reset {
            background-color: transparent;
            color: #DB7093;
            border: 1px dashed #FFB6C1;
            border-radius: 15px;
            padding: 9px 15px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-reset:hover {
            background-color: #FFE4E1;
            color: #C71585;
            border-style: solid;
        }

        /* CSS chung cho Popup / Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 182, 193, 0.6);
            backdrop-filter: blur(3px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.3);
            text-align: left;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #FFE4E1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 18px;
            color: #FF1493;
            font-weight: bold;
            margin: 0;
        }

        .close-btn {
            font-size: 24px;
            color: #FFB6C1;
            cursor: pointer;
            border: none;
            background: none;
            line-height: 1;
        }

        .history-list {
            max-height: 250px;
            overflow-y: auto;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #FFF0F5;
            color: #C71585;
            font-size: 15px;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-date {
            font-weight: bold;
        }

        .history-amount {
            color: #FF69B4;
            font-weight: bold;
        }

        /* Popup thông báo mốc thành tích */
        .achievement-content {
            text-align: center;
        }

        .achievement-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .achievement-text {
            font-size: 16px;
            color: #C71585;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-ok {
            background-color: #FF69B4;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(255, 105, 180, 0.3);
            width: 100%;
        }

        .btn-ok:hover {
            background-color: #FF1493;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Uống nước đi bà chã ơi! 💧</h1>
        <div class="date-text" id="displayDate">Hôm nay: ...</div>

        <div class="stats"><span id="currentWater">0</span> / 2000 ml</div>

        <div class="progress-wrapper">
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-marker marker-1300" id="marker1300" title="Mốc 1300ml"></div>
                <div class="progress-marker marker-1500" id="marker1500" title="Mốc 1500ml"></div>
                <div class="progress-marker marker-2000" id="marker2000" title="Mốc 2000ml"></div>
            </div>
            <div class="progress-labels">
                <span class="marker-label label-0">0ml</span>
                <span class="marker-label label-1300" id="label1300">1300</span>
                <span class="marker-label label-1500" id="label1500">1500</span>
                <span class="marker-label label-2000" id="label2000">2000ml 🎯</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn" onclick="addWater(150)">🥤 150ml</button>
            <button class="btn" onclick="addWater(250)">☕ 250ml</button>
            <button class="btn" onclick="addWater(500)">🧋 500ml</button>
        </div>

        <div class="custom-input-group">
            <input type="number" id="customAmountInput" class="custom-input" placeholder="Hoặc tự nhập số ml..." min="1" max="3000" onkeydown="if(event.key==='Enter') addCustomWater()" />
            <button class="btn-custom-add" onclick="addCustomWater()">+ Uống</button>
        </div>

        <!-- Ô nhập ghi chú món uống ngoài nước lọc -->
        <div class="note-input-group">
            <input type="text" id="drinkNoteInput" class="custom-input note-input" placeholder="Ún gì ngoài nước lọc thì ghi zo đây cho tui bít" onkeydown="if(event.key==='Enter') saveDrinkNote()" />
            <button class="btn-note-save" onclick="saveDrinkNote()" title="Lưu ghi chú">📝 Lưu</button>
        </div>

        <!-- Danh sách món đã uống hôm nay -->
        <div class="today-notes-section" id="todayNotesSection" style="display: none;">
            <div class="today-notes-title">🍹 Món ngoài nước lọc hôm nay:</div>
            <div class="today-notes-list" id="todayNotesList"></div>
        </div>

        <button class="btn-history" onclick="openHistory()">📅 Coi lại ngày cũ của bà chã</button>
        <button class="btn-reset" onclick="resetWater()">🔄 Đặt lại hôm nay về 0 ml</button>
    </div>

    <!-- Popup Thống kê lịch sử -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Lịch sử uống nước 🌸</h2>
                <button class="close-btn" onclick="closeHistory()">&times;</button>
            </div>
            <ul class="history-list" id="historyList"></ul>
        </div>
    </div>

    <!-- Popup Thông báo mốc thành tích -->
    <div class="modal-overlay" id="achievementModal">
        <div class="modal-content achievement-content">
            <div class="achievement-icon" id="achieveIcon">💧</div>
            <h3 class="modal-title" style="text-align: center; margin-bottom: 10px;" id="achieveTitle">Tuyệt vời!</h3>
            <p class="achievement-text" id="achieveDesc">Nội dung thông báo...</p>
            <button class="btn-ok" onclick="closeAchievement()">Dạaa ăm chãa! 💕</button>
        </div>
    </div>

    <script>
        // Tự động dùng /api/water nếu đang mở trên Render, hoặc trỏ đến Render nếu mở từ GitHub Pages hay Local
        const API_URL = (window.location.origin.includes('onrender.com')) 
            ? '/api/water' 
            : 'https://unnuoc.onrender.com/api/water';
        const targetWater = 2000;

        const todayStr = new Date().toLocaleDateString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh' });
        document.getElementById('displayDate').innerText = `Hôm nay: ${todayStr} 🌸`;

        // Cập nhật giao diện từ dữ liệu Database
        function updateUI(amount) {
            const currentVal = amount !== undefined && amount !== null ? amount : 0;
            document.getElementById('currentWater').innerText = currentVal;
            let percentage = (currentVal / targetWater) * 100;
            if (percentage > 100) percentage = 100;
            document.getElementById('progressBar').style.width = percentage + '%';

            // Cập nhật vạch và nhãn mốc tương ứng khi đạt tới
            const m1300 = document.getElementById('marker1300');
            const l1300 = document.getElementById('label1300');
            if (m1300 && l1300) {
                const reached = currentVal >= 1300;
                m1300.classList.toggle('reached', reached);
                l1300.classList.toggle('reached', reached);
            }

            const m1500 = document.getElementById('marker1500');
            const l1500 = document.getElementById('label1500');
            if (m1500 && l1500) {
                const reached = currentVal >= 1500;
                m1500.classList.toggle('reached', reached);
                l1500.classList.toggle('reached', reached);
            }

            const m2000 = document.getElementById('marker2000');
            const l2000 = document.getElementById('label2000');
            if (m2000 && l2000) {
                const reached = currentVal >= 2000;
                m2000.classList.toggle('reached', reached);
                l2000.classList.toggle('reached', reached);
            }
        }

        // Lấy dữ liệu ngày hôm nay từ Server khi mở web
        async function fetchTodayData() {
            try {
                let response = await fetch(`${API_URL}/today`);
                let data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || 'Lỗi server: ' + response.status);
                }
                if (data && data.dateString) {
                    document.getElementById('displayDate').innerText = `Hôm nay: ${data.dateString} 🌸`;
                }
                updateUI(data.amount);
                if (data && data.notes) {
                    renderTodayNotes(data.notes);
                }
            } catch (error) {
                console.error("Lỗi kết nối server:", error);
            }
        }

        // Gửi lượng nước khi bấm nút
        let isSubmitting = false;
        async function addWater(amount) {
            if (isSubmitting) return;
            isSubmitting = true;
            const buttons = document.querySelectorAll('.btn-group .btn, .btn-custom-add, .btn-note-save');
            buttons.forEach(btn => btn.style.opacity = '0.6');

            const noteInput = document.getElementById('drinkNoteInput');
            const noteText = noteInput ? noteInput.value.trim() : '';

            try {
                let response = await fetch(`${API_URL}/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, note: noteText })
                });
                let data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Lỗi từ máy chủ: ' + response.status);
                }

                // Kiểm tra an toàn trước khi cập nhật UI
                if (data && data.record) {
                    updateUI(data.record.amount);
                    if (data.record.notes) {
                        renderTodayNotes(data.record.notes);
                    }
                }

                // Nếu đạt mốc mới thì hiện Popup chúc mừng từ Server
                if (data && data.milestoneReached) {
                    showAchievement(data.milestoneReached.title, data.milestoneReached.desc);
                }

                if (noteInput && noteText) {
                    noteInput.value = '';
                }
            } catch (error) {
                console.error("Lỗi gửi dữ liệu:", error);
                alert("Lỗi kết nối máy chủ:\n" + (error.message || "Mạng lỗi rồi bà chã ơi!"));
            } finally {
                isSubmitting = false;
                buttons.forEach(btn => btn.style.opacity = '1');
            }
        }

        // Nhập số ml bằng tay
        async function addCustomWater() {
            const inputEl = document.getElementById('customAmountInput');
            if (!inputEl) return;
            const val = parseInt(inputEl.value.trim(), 10);

            if (isNaN(val) || val <= 0) {
                alert("Bà chã nhập số ml lớn hơn 0 nhé! 💧");
                inputEl.focus();
                return;
            }

            if (val > 3000) {
                if (!confirm(`Bà chã uống tận ${val} ml một lần thiệt luôn hả? 😲`)) {
                    return;
                }
            }

            await addWater(val);
            inputEl.value = '';
            inputEl.blur();
        }

        // Lưu ghi chú món uống riêng
        async function saveDrinkNote() {
            const noteInput = document.getElementById('drinkNoteInput');
            if (!noteInput) return;
            const text = noteInput.value.trim();

            if (!text) {
                alert("Bà chã chưa ghi món gì nè! 🌸");
                noteInput.focus();
                return;
            }

            const saveBtn = document.querySelector('.btn-note-save');
            if (saveBtn) saveBtn.style.opacity = '0.6';

            try {
                let response = await fetch(`${API_URL}/note`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ note: text })
                });
                let data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Lỗi server: ' + response.status);
                }

                if (data && data.record && data.record.notes) {
                    renderTodayNotes(data.record.notes);
                }
                noteInput.value = '';
            } catch (error) {
                console.error("Lỗi lưu ghi chú:", error);
                alert("Không thể lưu ghi chú:\n" + (error.message || "Mạng lỗi rồi bà chã ơi!"));
            } finally {
                if (saveBtn) saveBtn.style.opacity = '1';
            }
        }

        // Hiển thị danh sách món uống hôm nay
        function renderTodayNotes(notes) {
            const section = document.getElementById('todayNotesSection');
            const list = document.getElementById('todayNotesList');
            if (!section || !list) return;

            if (!notes || notes.length === 0) {
                section.style.display = 'none';
                list.innerHTML = '';
                return;
            }

            section.style.display = 'block';
            list.innerHTML = notes.map((n, idx) => `
                <span class="note-badge" onclick="toggleNoteBadge(event, this)">
                    <span>🧋 ${escapeHtml(n)}</span>
                    <button type="button" class="note-del-btn" title="Xóa món này" onclick="deleteNote(event, ${idx})">&times;</button>
                </span>
            `).join('');
        }

        // Bật/tắt dấu x khi chạm vào món trên điện thoại
        function toggleNoteBadge(event, badgeEl) {
            if (event.target.classList.contains('note-del-btn')) return;
            document.querySelectorAll('.note-badge').forEach(b => {
                if (b !== badgeEl) b.classList.remove('show-del');
            });
            badgeEl.classList.toggle('show-del');
        }

        // Xóa món uống khỏi database
        async function deleteNote(event, index) {
            event.stopPropagation();
            const badgeEl = event.target.closest('.note-badge');
            if (badgeEl) badgeEl.style.opacity = '0.4';

            try {
                let response = await fetch(`${API_URL}/note/delete`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ index })
                });
                let data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Lỗi server: ' + response.status);
                }

                if (data && data.record) {
                    renderTodayNotes(data.record.notes || []);
                }
            } catch (error) {
                console.error("Lỗi xóa ghi chú:", error);
                alert("Không thể xóa món:\n" + (error.message || "Mạng lỗi rồi bà chã ơi!"));
                if (badgeEl) badgeEl.style.opacity = '1';
            }
        }

        // Chạm ra ngoài để ẩn dấu x
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.note-badge')) {
                document.querySelectorAll('.note-badge.show-del').forEach(b => b.classList.remove('show-del'));
            }
        });

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showAchievement(title, desc) {
            document.getElementById('achieveTitle').innerText = title;
            document.getElementById('achieveDesc').innerText = desc;
            document.getElementById('achievementModal').style.display = 'flex';
        }

        function closeAchievement() {
            document.getElementById('achievementModal').style.display = 'none';
        }

        // --- LẤY LỊCH SỬ TỪ DATABASE CHO NÚT "COI LẠI NGÀY CŨ" ---
        async function openHistory() {
            const listEl = document.getElementById('historyList');
            listEl.innerHTML = '<li class="history-item">Đang tải...</li>';
            document.getElementById('historyModal').style.display = 'flex';

            try {
                let response = await fetch(`${API_URL}/history`);
                let historyData = await response.json();

                if (!response.ok) {
                    throw new Error(historyData.error || 'Lỗi server: ' + response.status);
                }

                listEl.innerHTML = '';
                if (!historyData || historyData.length === 0) {
                    listEl.innerHTML = '<li class="history-item">Chưa có dữ liệu nào nè!</li>';
                } else {
                    historyData.forEach(item => {
                        let isToday = (item.dateString === todayStr) ? " (Hôm nay)" : "";
                        let notesHtml = "";
                        if (item.notes && item.notes.length > 0) {
                            notesHtml = `<div class="history-notes">🍹 ${item.notes.map(n => escapeHtml(n)).join(', ')}</div>`;
                        }
                        listEl.innerHTML += `
                            <li class="history-item">
                                <div style="text-align: left;">
                                    <span class="history-date">${item.dateString}${isToday}</span>
                                    ${notesHtml}
                                </div>
                                <span class="history-amount">${item.amount} ml</span>
                            </li>
                        `;
                    });
                }
            } catch (error) {
                console.error("Lỗi lấy lịch sử:", error);
                listEl.innerHTML = `<li class="history-item">Không tải được lịch sử (${error.message})!</li>`;
            }
        }

        // Đặt lại lượng nước hôm nay về 0
        async function resetWater() {
            const confirmed = confirm("Bà chã có chắc muốn đặt lại thanh tiến độ hôm nay về 0 ml không? 🌸");
            if (!confirmed) return;

            const resetBtn = document.querySelector('.btn-reset');
            if (resetBtn) resetBtn.style.opacity = '0.6';

            try {
                let response = await fetch(`${API_URL}/reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                let data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Lỗi từ máy chủ: ' + response.status);
                }

                updateUI(0);
                alert("Đã đặt lại thanh tiến độ về 0 ml rùi nha! 💧");
            } catch (error) {
                console.error("Lỗi khi reset:", error);
                alert("Không thể đặt lại:\n" + (error.message || "Mạng lỗi rồi bà chã ơi!"));
            } finally {
                if (resetBtn) resetBtn.style.opacity = '1';
            }
        }

        function closeHistory() {
            document.getElementById('historyModal').style.display = 'none';
        }

        // Chạy lấy dữ liệu ngay khi load trang
        fetchTodayData();
    </script>
</body>

</html>
